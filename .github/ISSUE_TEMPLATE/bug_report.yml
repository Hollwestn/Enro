name: Ошибка
description: Сообщить о воспроизводимой проблеме Enro
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Не публикуйте личные пути, токены или базу истории. Замените имена пользователей и личные папки в примерах."
  - type: input
    id: version
    attributes:
      label: Версия Enro и Windows
      placeholder: Enro 2.0.0, Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Шаги, ожидаемое и фактическое поведение.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Дополнительные сведения
      description: Текст ошибки или скриншот без личной информации.
